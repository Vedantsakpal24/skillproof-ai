version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      # Mount the database to persist data between container restarts
      - ./backend/app/skillproof.db:/app/app/skillproof.db
    environment:
      - ENV=production

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
